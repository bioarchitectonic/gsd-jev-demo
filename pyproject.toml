[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gsd-jev-demo"
version = "0.2.0"
description = "Direct GSD diagnosis choices from synthetic educational vignettes with Jev."
readme = "README.md"
authors = [{ name = "Jeong-Pyo Han" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["typesafe-sdk==0.7.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
gsd-demo = "gsd_demo.cli:main"

[tool.setuptools.packages.find]
include = ["gsd_demo*"]

[tool.setuptools.package-data]
gsd_demo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
